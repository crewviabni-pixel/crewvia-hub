<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crewvia WhatsApp Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      background: #10b981;
      color: #0f172a;
      font-weight: 800;
      font-size: 13px;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      font-weight: 600;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .status-dot.busy {
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat-card {
      background: #1e293b;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .stat-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
    }
    .stat-val {
      font-size: 18px;
      font-weight: 700;
      color: #f8fafc;
      margin-top: 4px;
    }
    .settings-group {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .settings-title {
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    .delay-info {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #10b981;
    }
    .footer {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      line-height: 1.4;
    }
    .btn-clear {
      background: transparent;
      border: 1px solid #475569;
      color: #cbd5e1;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      width: 100%;
      margin-top: 6px;
    }
    .btn-clear:hover {
      background: #334155;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-badge">C</div>
      <span class="title">Crewvia Bridge</span>
    </div>
    <div class="status-badge">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Active</span>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Queue</div>
      <div class="stat-val" id="queueVal">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Sent Today</div>
      <div class="stat-val" id="sentTodayVal">0</div>
    </div>
  </div>

  <div class="settings-group">
    <div class="settings-title">Anti-Ban Throttle (Jitter Delay)</div>
    <div class="delay-info">
      <span>Min Interval: <b id="minDelayText">4s</b></span>
      <span>Max: <b id="maxDelayText">7s</b></span>
    </div>
    <input type="range" id="delaySlider" min="3" max="10" step="1" value="5">
    <button class="btn-clear" id="btnClearQueue">Clear Active Queue</button>
  </div>

  <div class="footer">
    Works seamlessly with Crewvia Hub CRM.<br>Keep WhatsApp Web open in Chrome.
  </div>

  <script src="popup.js"></script>
</body>
</html>
